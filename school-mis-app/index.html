<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School MIS</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body { background: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #root { height: 100%; }

      /* Instant layout skeleton — shown before JS loads, removed once React mounts.
         Mirrors the real AppShell (220px dark sidebar + light content) so there
         is zero visible shift between the HTML skeleton and the React render. */
      #app-skeleton {
        display: flex;
        height: 100vh;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #F9FAFB;
      }
      #app-skeleton-sidebar {
        width: 220px;
        flex-shrink: 0;
        background: #0F172A;
      }
      #app-skeleton-main {
        flex: 1;
        background: #F9FAFB;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #app-skeleton-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #E5E7EB;
        border-top-color: #7C3AED;
        border-radius: 50%;
        animation: mis-spin 0.7s linear infinite;
      }
      @keyframes mis-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- Skeleton visible immediately (before JS) — React removes it on mount -->
    <div id="app-skeleton">
      <div id="app-skeleton-sidebar"></div>
      <div id="app-skeleton-main">
        <div id="app-skeleton-spinner"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
