version: "3.9"

services:

  # ── 1. PostgreSQL ──────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: school-mis-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       school_mis
      POSTGRES_USER:     school_mis
      POSTGRES_PASSWORD: school_mis_secret
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_mis -d school_mis"]
      interval: 10s
      timeout:  5s
      retries:  5
      start_period: 15s

  # ── 2. FastAPI backend ─────────────────────────────────────
  backend:
    build:
      context:    .
      dockerfile: Dockerfile.backend
    image: school-mis-backend:latest
    container_name: school-mis-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://school_mis:school_mis_secret@postgres:5432/school_mis
      # Uncomment to enable payment gateways:
      # FLW_SECRET_KEY:      your_flutterwave_key
      # PAYSTACK_SECRET_KEY: your_paystack_key
    volumes:
      - uploads:/app/backend/uploads
    expose:
      - "8765"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8765/api/health"]
      interval: 30s
      timeout:  10s
      retries:  3
      start_period: 20s

  # ── 3. React frontend (nginx serving built SPA) ────────────
  frontend:
    build:
      context:    .
      dockerfile: Dockerfile.frontend
    image: school-mis-frontend:latest
    container_name: school-mis-frontend
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout:  5s
      retries:  3
      start_period: 10s

  # ── 4. Nginx reverse proxy (port 80 — Cloudflare handles HTTPS) ──
  nginx:
    image: nginx:1.25-alpine
    container_name: school-mis-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pg_data:   # PostgreSQL data — survives container rebuilds
  uploads:   # Uploaded media files (landing page images, etc.)
