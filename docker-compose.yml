version: "3.9"

# Secrets are loaded from .env (gitignored).
# Copy .env.example → .env and fill in values before running.

services:

  # ── 1. PostgreSQL ──────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: school-mis-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout:  5s
      retries:  5
      start_period: 15s

  # ── 2. FastAPI backend ─────────────────────────────────────
  backend:
    build:
      context:    .
      dockerfile: Dockerfile.backend
    image: school-mis-backend:latest
    container_name: school-mis-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL:      ${DATABASE_URL}
      FINANCE_HMAC_KEY:  ${FINANCE_HMAC_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # Payment gateways — blank values mean the provider is disabled (no error)
      FLW_SECRET_KEY:      ${FLW_SECRET_KEY}
      FLW_PUBLIC_KEY:      ${FLW_PUBLIC_KEY}
      FLW_WEBHOOK_SECRET:  ${FLW_WEBHOOK_SECRET}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
    volumes:
      - uploads:/app/backend/uploads
    expose:
      - "8765"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8765/api/health"]
      interval: 30s
      timeout:  10s
      retries:  3
      start_period: 20s

  # ── 3. React frontend (nginx serving built SPA) ────────────
  frontend:
    build:
      context:    .
      dockerfile: Dockerfile.frontend
    image: school-mis-frontend:latest
    container_name: school-mis-frontend
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout:  5s
      retries:  3
      start_period: 10s

  # ── 4. Nginx reverse proxy (port 80 — Cloudflare handles HTTPS) ──
  nginx:
    image: nginx:1.25-alpine
    container_name: school-mis-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pg_data:   # PostgreSQL data — survives container rebuilds
  uploads:   # Uploaded media files (landing page images, etc.)
