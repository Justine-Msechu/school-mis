worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile       on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    # Rate limiting: 60 req/s per IP, burst 120
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/s;

    upstream backend  { server backend:8765;  keepalive 32; }
    upstream frontend { server frontend:80;   keepalive 32; }

    # ── Cloudflare Tunnel entry point (domain traffic) ─────────────────
    # Cloudflare terminates HTTPS; traffic arrives here over HTTP on port 80.
    # X-Forwarded-Proto: https tells the backend the original request was HTTPS.
    server {
        listen 80;
        server_name maarifahub.co.tz www.maarifahub.co.tz;

        client_max_body_size 20M;

        location /api/ {
            limit_req zone=api burst=120 nodelay;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_read_timeout 30s;
        }

        location /uploads/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host  $host;
            proxy_read_timeout 30s;
        }

        location /api/notifications/stream {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection  "";
            proxy_set_header   Host        $host;
            proxy_set_header   X-Real-IP   $remote_addr;
            proxy_read_timeout 3600s;
            proxy_buffering    off;
            proxy_cache        off;
        }

        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host       $host;
            proxy_read_timeout 30s;
        }
    }

    # ── LAN / direct IP access (no domain, no HTTPS required) ──────────
    server {
        listen 80 default_server;
        server_name _;

        client_max_body_size 20M;

        location /api/ {
            limit_req zone=api burst=120 nodelay;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location /uploads/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host  $host;
            proxy_read_timeout 30s;
        }

        location /api/notifications/stream {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection  "";
            proxy_set_header   Host        $host;
            proxy_set_header   X-Real-IP   $remote_addr;
            proxy_read_timeout 3600s;
            proxy_buffering    off;
            proxy_cache        off;
        }


        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host       $host;
            proxy_read_timeout 30s;
        }
    }
}
