worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile       on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    # Rate limiting: 60 req/s per IP, burst 120
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/s;

    upstream backend  { server backend:8765;  keepalive 32; }
    upstream frontend { server frontend:80;   keepalive 32; }

    # ── HTTP — ACME challenge + redirect to HTTPS ──────────────
    server {
        listen 80;
        server_name maarifahub.co.tz www.maarifahub.co.tz;

        # Let's Encrypt webroot challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS ──────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name maarifahub.co.tz www.maarifahub.co.tz;

        ssl_certificate     /etc/letsencrypt/live/maarifahub.co.tz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/maarifahub.co.tz/privkey.pem;

        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "DENY"        always;
        add_header X-Content-Type-Options    "nosniff"     always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        client_max_body_size 20M;

        # ── API (rate-limited) ────────────────────────────────
        location /api/ {
            limit_req zone=api burst=120 nodelay;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── Uploaded media files ──────────────────────────────
        location /uploads/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host  $host;
            proxy_read_timeout 30s;
        }

        # ── SSE — long-lived streaming connections ────────────
        location /api/notifications/stream {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection  "";
            proxy_set_header   Host        $host;
            proxy_set_header   X-Real-IP   $remote_addr;
            proxy_read_timeout 3600s;
            proxy_buffering    off;
            proxy_cache        off;
        }

        # ── React SPA (everything else → frontend container) ──
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host       $host;
            proxy_read_timeout 30s;
        }
    }
}
