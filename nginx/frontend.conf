server {
    listen 80;
    root  /usr/share/nginx/html;
    index index.html;

    # SPA: every unknown path returns index.html for React Router.
    # No-cache on the HTML shell so browsers always fetch the latest
    # index.html and pick up new chunk hashes after a redeploy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Content-hashed assets — cache aggressively (hash changes on rebuild)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # Explicit exact match for direct /index.html requests
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
